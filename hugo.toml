baseURL = "https://mariolne.github.io/"
locale = "zh-cn"
defaultContentLanguage = "zh"
title = "Mario"
theme = "PaperMod"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 80

[pagination]
    pagerSize = 10

# 代码高亮：输出 class 而非内联样式，配色由 assets/css/includes/chroma-styles.css 控制
[markup]
    [markup.highlight]
        noClasses = false
        style = "github"
        lineNos = false
        codeFences = true
        guessSyntax = false
        tabWidth = 4

[outputs]
    home = ["HTML", "RSS", "JSON"]

[params]
    env = "production"
    author = "Mario"
    description = "算法题解 · 学习笔记"
    defaultTheme = "auto"
    ShowReadingTime = true
    ShowShareButtons = false
    ShowPostNavLinks = true
    ShowBreadCrumbs = true
    ShowCodeCopyButtons = true
    ShowToc = true
    TocOpen = false
    ShowFullTextinRSS = true
    displayFullLangName = false
    DateFormat = "2006-01-02"

    [params.profileMode]
        enabled = true
        title = "Mario"
        subtitle = "算法题解 · 学习笔记 · 随手记"
        imageWidth = 120
        imageHeight = 120

        [[params.profileMode.buttons]]
            name = "题解"
            url = "posts/"

        [[params.profileMode.buttons]]
            name = "标签"
            url = "tags/"

        [[params.profileMode.buttons]]
            name = "关于"
            url = "about/"

    [[params.socialIcons]]
            name = "github"
            url = "https://github.com/Mariolne"

[[menu.main]]
    identifier = "posts"
    name = "题解"
    url = "/posts/"
    weight = 10

[[menu.main]]
    identifier = "tags"
    name = "标签"
    url = "/tags/"
    weight = 20

[[menu.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30

[[menu.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

[[menu.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 50